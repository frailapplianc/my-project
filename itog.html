/* ===== Изображения ===== */
function readLogo(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=max;c.height=max;
      const ctx=c.getContext('2d');
      const m=Math.min(max/img.width,max/img.height);
      const w=img.width*m,h=img.height*m;
      ctx.drawImage(img,(max-w)/2,(max-h)/2,w,h);
      cb(c.toDataURL('image/png'));
    };
    img.onerror=()=>cb(r.result);
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function readImage(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const m=Math.min(max/img.width,max/img.height,1);
      c.width=Math.max(1,Math.round(img.width*m));c.height=Math.max(1,Math.round(img.height*m));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/png'));
    };
    img.onerror=()=>cb(r.result);
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* ===== Пароль ===== */
async function sha256(str){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381;for(const c of str)h=((h*33)^c.charCodeAt(0))>>>0;
    return 'f'+h.toString(16);
  }
}
async function checkPass(){
  const v=$('#passEntry').value;
  const h=await sha256(v);
  if(h===state.settings.passwordHash){$('#passOverlay').classList.add('hidden');$('#passErr').textContent='';}
  else{$('#passErr').textContent='Неверный пароль';}
}
function setPassword(f){
  const v=f.passInput.value;
  if(v.length<3)return toast('Пароль слишком короткий','err');
  sha256(v).then(h=>{state.settings.passwordHash=h;save();closeModal();toast('Пароль сохранён');});
}

/* ===== Экспорт / импорт ===== */
function download(filename,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){
  download('drops-backup-'+todayISO().replace(/-/g,'')+'.json',JSON.stringify(state,null,2),'application/json');
  toast('Резервная копия экспортирована');
}
function handleImport(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s||!Array.isArray(s.banks)||!Array.isArray(s.drops))throw 0;
      if(!Array.isArray(s.records))s.records=[];
      openConfirm({title:'Импортировать резервную копию?',text:'\nТекущие данные будут заменены данными из файла.',onYes:()=>{
        state=s;
        state.settings=state.settings||{theme:'dark',passwordHash:null,demo:false,logo:null};
        state.settings.demo=false;
        save();renderLogo();applyTheme();renderTable();toast('Данные восстановлены');
      }});
    }catch(e){toast('Ошибка: неверный формат файла','err');}
  };
  r.readAsText(file,'utf-8');
}
const csvCell=v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function exportCSV(){
  const rows=[['ФИО','Позывной','Дата','Материал','Статус материала','Выплата за материал','Статус выплаты','Заработок с ЛК'].join(';')];
  for(const r of filteredRecords()){
    const d=dropById(r.dropId);
    rows.push([
      d?d.fio:'',d?d.feo:'',fmtDate(r.date),
      r.material,MAT_STATUS[r.materialStatus]?MAT_STATUS[r.materialStatus][0]:'',
      r.payment,PAY_STATUS[r.payStatus]?PAY_STATUS[r.payStatus][0]:'',
      r.income
    ].map(csvCell).join(';'));
  }
  download('journal-'+todayISO()+'.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
  toast('CSV экспортирован');
}

/* ===== Тема ===== */
function applyTheme(){
  document.documentElement.dataset.theme=state.settings.theme;
  $('#themeBtn').textContent=state.settings.theme==='dark'?'☀':'☾';
}
function toggleTheme(){
  state.settings.theme=state.settings.theme==='dark'?'light':'dark';
  save();applyTheme();
}

/* ===== Панель банков ===== */
function bankBarHTML(){
  const counts={};
  for(const r of state.records){
    const d=dropById(r.dropId);
    if(d&&d.bankId)counts[d.bankId]=(counts[d.bankId]||0)+1;
  }
  const chips=state.banks.map(b=>`
    <button class="chip ${ui.bankFilter===b.id?'active':''}" data-action="bank-set" data-id="${b.id}">
      ${chipLogo(b)}${esc(b.name)}<span class="cnt">${counts[b.id]||0}</span>
    </button>`).join('');
  return `<span class="lbl">Банки</span>
    <button class="chip ${ui.bankFilter==='all'?'active':''}" data-action="bank-set" data-id="all">Все</button>
    ${chips}
    <button class="chip" data-action="banks-manage" title="Управлять банками" aria-label="Управлять банками">⚙</button>`;
}
function renderBankBar(){$('#bankbar').innerHTML=bankBarHTML();}

/* ===== События ===== */
document.addEventListener('click',e=>{
  if(e.target.id==='passPhotoX'){profilePhoto=null;refreshPassPhotoView();return;}
  if(e.target.closest('#passPhotoSlot')){const f=document.getElementById('passPhotoFile');if(f)f.click();return;}
  if(e.target.id==='passChange'){$('#passZone').classList.toggle('hidden');return;}
  if(e.target.id==='passRemove'){
    openConfirm({title:'Убрать пароль?',text:'\nВход в систему будет свободным.',danger:true,onYes:()=>{state.settings.passwordHash=null;save();closeModal();toast('Пароль убран');}});
    return;
  }
  const chipBtn=e.target.closest('.chip-toggle');
  if(chipBtn){
    e.stopPropagation();
    const stack=chipBtn.closest('.cell-stack');
    const open=stack.classList.toggle('open');
    chipBtn.setAttribute('aria-expanded',open?'true':'false');
    return;
  }
  const el=e.target.closest('[data-action]');
  if(!el)return;
  switch(el.dataset.action){
    case 'view':setView(el.dataset.view);break;
    case 'bank-set':ui.bankFilter=el.dataset.id;setView(ui.view);break;
    case 'banks-manage':openBanksModal();break;
    case 'bank-add':{
      const nameEl=$('#newBankName'),colorEl=$('#newBankColor');
      const name=nameEl?nameEl.value.trim():'';
      if(!name){toast('Введи название банка','err');return;}
      state.banks.push({id:uid(),name,color:colorEl?colorEl.value:BANK_COLORS[0],logo:null});
      save();setView(ui.view);refreshBanksModal();toast('Банк добавлен');
      break;}
    case 'bank-del':delBank(el.dataset.id);break;
    case 'rec-new':openRecModal();break;
    case 'rec-del':delRec(el.dataset.id);break;
    case 'rec-assign':openAssign(el.dataset.id);break;
    case 'assign-ok':{
      const rec=state.records.find(r=>r.id===el.dataset.id);
      const sel=document.getElementById('assignDrop');
      if(rec&&sel&&sel.value){rec.dropId=sel.value;save();closeModal();setView(ui.view);toast('Дроп назначен');}
      else toast('Выбери дропа','err');
      break;}
    case 'drop-new':openProfile(null);break;
    case 'drop-profile':openProfile(dropById(el.dataset.id));break;
    case 'drop-del':delDrop(el.dataset.id);break;
    case 'export-csv':exportCSV();break;
    case 'export-json':exportJSON();break;
    case 'import-file':{const f=$('#importFile');if(f)f.click();break;}
    case 'clear-demo':clearDemo();break;
    case 'reset-all':resetAll();break;
    case 'print':window.print();break;
    case 'theme':toggleTheme();break;
    case 'settings':openSettingsModal();break;
    case 'modal-close':closeModal();break;
    case 'confirm-yes':confirmYes();break;
    case 'confirm-no':closeModal();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  const field=t.dataset&&t.dataset.field;
  if(field&&t.closest('tr[data-rec]')){
    const tr=t.closest('tr[data-rec]');
    const rec=state.records.find(r=>r.id===tr.dataset.rec);
    if(rec){
      if(field==='material'||field==='payment'||field==='income'){
        let v=parseFloat(String(t.value).replace(',','.'));
        if(isNaN(v))v=0;rec[field]=v;
      } else if(field==='date'){if(t.value)rec.date=t.value;}
      else if(field==='materialStatus'){rec.materialStatus=t.value;t.className='st-select '+matClass(t.value);}
      else if(field==='payStatus'){rec.payStatus=t.value;t.className='st-select '+payClass(t.value);}
      else if(field==='bankId'&&t.dataset.banksel){const d=dropById(rec.dropId);if(d)d.bankId=t.value||null;}
      save();updateSummary();
      // обновить чипы этой строки: сумма выплаты + оба статус-бейджа
      const payT=tr.querySelector('.chip-toggle[data-chip="payment"]');
      if(payT){const st=payT.closest('.cell-stack');const amt=st.querySelector('.chip-amt');if(amt)amt.textContent=money(rec.payment);}
      const matBadge=tr.querySelector('.chip-toggle[data-chip="material"] .st-badge');
      if(matBadge){matBadge.className='st-badge '+matClass(rec.materialStatus);matBadge.lastChild.textContent=MAT_STATUS[rec.materialStatus][0];}
      const payBadge=tr.querySelector('.chip-toggle[data-chip="payment"] .st-badge');
      if(payBadge){payBadge.className='st-badge '+payClass(rec.payStatus);payBadge.lastChild.textContent=PAY_STATUS[rec.payStatus][0];}
    }
    return;
  }
  if(t.id==='passPhotoFile'){
    const f=t.files[0];
    if(f)readImage(f,600,url=>{profilePhoto=url;refreshPassPhotoView();});
    t.value='';
    return;
  }
  if(t.id==='periodFilter'){ui.period=t.value;setView(ui.view);return;}
  if(t.id==='customFrom'){ui.customFrom=t.value;setView(ui.view);return;}
  if(t.id==='customTo'){ui.customTo=t.value;setView(ui.view);return;}
  if(t.id==='importFile'){handleImport(t.files[0]);t.value='';return;}
  if(t.classList&&t.classList.contains('bankNameInput')){
    const b=bankById(t.dataset.id);
    if(b&&t.value.trim()){b.name=t.value.trim();save();setView(ui.view);}
    return;
  }
  if(t.classList&&t.classList.contains('bankColorInput')){
    const b=bankById(t.dataset.id);
    if(b){b.color=t.value;save();renderBankBar();}
    return;
  }
  if(t.dataset&&t.dataset.banklogo){
    const id=t.dataset.banklogo,f=t.files[0];
    if(f){
      readLogo(f,64,url=>{
        const b=bankById(id);
        if(b){b.logo=url;save();setView(ui.view);refreshBanksModal();toast('Логотип банка загружен');}
      });
      t.value='';
    }
    return;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='searchInput'){ui.search=e.target.value;renderTable();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='recForm')saveRec(f);
  else if(f.id==='dropForm')saveProfile(f);
  else if(f.id==='passForm')setPassword(f);
});
$('#passFormEntry').addEventListener('submit',async e=>{e.preventDefault();await checkPass();});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

/* ===== Горячие клавиши ===== */
document.addEventListener('keydown',e=>{
  const passVisible=!$('#passOverlay').classList.contains('hidden');
  if(e.key==='Escape'){if(!passVisible&&$('#overlay').classList.contains('open'))closeModal();return;}
  if(passVisible)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
  if(e.key==='n'||e.key==='N'||e.key==='т'||e.key==='Т'){openRecModal();}
  else if(e.key==='/'){e.preventDefault();const s=document.getElementById('searchInput');if(s)s.focus();}
  else if(e.key==='1')setView('table');
  else if(e.key==='2')setView('dash');
});

/* ===== Запуск ===== */
applyTheme();
renderLogo();
setView('table');
save();
if(firstRun)toast('Загружены демо-данные — их можно очистить в настройках (⚙)',3200);
if(state.settings.passwordHash){
  $('#passOverlay').classList.remove('hidden');
  $('#passEntry').focus();
}

})();
</script>
</body>
</html>
